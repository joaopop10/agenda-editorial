<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Agenda</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Public+Sans:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
  :root{color-scheme:light dark}
  body{margin:0}
  img{max-width:100%}
  [hidden]{display:none !important}
</style>
</head>
<body>
<style>
:root{
  --ground:#FBFAFC; --surface:#FFFFFF; --sunk:#F4F2F7;
  --ink:#0F1419; --ink-2:#536471; --ink-3:#8B93A1;
  --line:#E5E1EC; --line-forte:#CFC8DC;
  --roxo:#6C2BD9; --roxo-tinta:#5A21B8; --roxo-lavado:#F1E9FD;
  --teal:#3D7F8E; --verde:#2F7E56; --vermelho:#B3423F; --ambar:#8A6212;
  --teal-lavado:#E6F1F3; --verde-lavado:#E5F2EB; --ambar-lavado:#F7EFDC;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ground:#121019; --surface:#1B1826; --sunk:#211D2F;
    --ink:#F3F1F8; --ink-2:#A8A2B8; --ink-3:#736D85;
    --line:#2E2940; --line-forte:#413A57;
    --roxo:#AC85FF; --roxo-tinta:#C0A3FF; --roxo-lavado:#271D40;
    --teal:#7FC1CE; --verde:#6FC195; --vermelho:#E58A87; --ambar:#D6AB56;
    --teal-lavado:#1B2C31; --verde-lavado:#182B22; --ambar-lavado:#2C2413;
  }
}
:root[data-theme="dark"]{
  --ground:#121019; --surface:#1B1826; --sunk:#211D2F;
  --ink:#F3F1F8; --ink-2:#A8A2B8; --ink-3:#736D85;
  --line:#2E2940; --line-forte:#413A57;
  --roxo:#AC85FF; --roxo-tinta:#C0A3FF; --roxo-lavado:#271D40;
  --teal:#7FC1CE; --verde:#6FC195; --vermelho:#E58A87; --ambar:#D6AB56;
  --teal-lavado:#1B2C31; --verde-lavado:#182B22; --ambar-lavado:#2C2413;
}

*{box-sizing:border-box}
body{
  background:var(--ground); color:var(--ink);
  font:400 15px/1.5 "Public Sans","Segoe UI",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;
}
.env{max-width:1240px; margin:0 auto; padding:28px 20px 72px}
h1,h2,h3{font-family:"Bricolage Grotesque","Public Sans",system-ui,sans-serif;
  margin:0; text-wrap:balance; letter-spacing:-.02em}
.mono{font-family:"IBM Plex Mono",ui-monospace,monospace; font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--roxo); outline-offset:2px; border-radius:4px}

/* ---------------------------------------------------------- cabeçalho */
.topo{display:flex; flex-wrap:wrap; align-items:flex-end; gap:20px 28px;
  padding-bottom:20px; border-bottom:2px solid var(--ink); margin-bottom:26px}
.marca h1{font-size:31px; font-weight:800; line-height:1.05}
.marca .arroba{color:var(--ink-2); font-size:14px; margin-top:5px;
  font-family:"IBM Plex Mono",monospace}
.ritmo{display:flex; gap:8px; flex-wrap:wrap; margin-left:auto}
.ritmo-item{display:flex; align-items:baseline; gap:7px; padding:6px 11px;
  background:var(--sunk); border-radius:999px; font-size:12.5px; color:var(--ink-2)}
.ritmo-item b{font-family:"IBM Plex Mono",monospace; color:var(--ink); font-weight:600}
.ritmo-item.atualizada{background:none; border:1px dashed var(--line-forte);
  color:var(--ink-3); font-size:11.5px}

/* ------------------------------------------------------------- resumo */
.resumo{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
  gap:1px; background:var(--line); border:1px solid var(--line);
  border-radius:10px; overflow:hidden; margin-bottom:34px}
.resumo div{background:var(--surface); padding:14px 16px}
.resumo .k{font-size:11px; text-transform:uppercase; letter-spacing:.09em;
  color:var(--ink-3); font-weight:600}
.resumo .v{font-family:"Bricolage Grotesque",sans-serif; font-size:25px;
  font-weight:700; margin-top:3px; letter-spacing:-.02em}
.resumo .v small{font-size:13px; font-weight:500; color:var(--ink-2);
  font-family:"Public Sans",sans-serif; letter-spacing:0}

/* ------------------------------------------------------------- seções */
section{margin-bottom:44px}
.cab{display:flex; align-items:center; gap:14px; margin-bottom:16px}
.cab h2{font-size:20px; font-weight:700}
.cab .conta{font-size:12.5px; color:var(--ink-3);
  font-family:"IBM Plex Mono",monospace}
.cab .nav{margin-left:auto; display:flex; gap:6px; align-items:center}
.btn{font:500 13px/1 "Public Sans",sans-serif; color:var(--ink);
  background:var(--surface); border:1px solid var(--line-forte);
  padding:8px 12px; border-radius:7px; cursor:pointer}
.btn:hover{border-color:var(--roxo); color:var(--roxo)}
.btn[disabled]{opacity:.4; cursor:default}
.periodo{font-family:"IBM Plex Mono",monospace; font-size:13px;
  color:var(--ink-2); min-width:158px; text-align:center}

/* -------------------------------------------------------- a semana */
.semana{display:grid; grid-template-columns:repeat(7,1fr); gap:10px;
  align-items:start}
.dia{background:var(--surface); border:1px solid var(--line);
  border-radius:11px; overflow:hidden; display:flex; flex-direction:column}
.dia.hoje{border-color:var(--roxo); box-shadow:0 0 0 2px var(--roxo-lavado)}
.dia-cab{padding:9px 11px; border-bottom:1px solid var(--line);
  display:flex; align-items:baseline; justify-content:space-between; gap:6px}
.dia-cab .semana-nome{font-size:10.5px; text-transform:uppercase;
  letter-spacing:.1em; color:var(--ink-3); font-weight:600}
.dia-cab .num{font-family:"Bricolage Grotesque",sans-serif; font-size:19px;
  font-weight:700; line-height:1}
.dia.hoje .dia-cab{background:var(--roxo-lavado)}
.dia.hoje .dia-cab .semana-nome, .dia.hoje .dia-cab .num{color:var(--roxo-tinta)}
.dia-corpo{padding:9px; display:flex; flex-direction:column; gap:9px; flex:1}

.slot{width:100%; text-align:left; background:none; border:0; padding:0;
  font:inherit; color:inherit; cursor:pointer; display:block}
.slot .capa{display:block; width:100%; aspect-ratio:4/5; object-fit:cover;
  border-radius:7px; background:var(--sunk); border:1px solid var(--line)}
.slot .semcapa{display:flex; align-items:center; justify-content:center;
  aspect-ratio:4/5; border-radius:7px; background:var(--sunk);
  border:1px solid var(--line); color:var(--ink-3); font-size:11px;
  text-align:center; padding:8px}
.slot:hover .capa{border-color:var(--roxo)}
.slot .meta{display:flex; align-items:center; gap:6px; margin:7px 0 3px}
.slot .hora{font-family:"IBM Plex Mono",monospace; font-size:12px;
  font-weight:600; color:var(--ink)}
.slot .nome{font-size:13px; line-height:1.3; color:var(--ink); font-weight:500;
  display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical;
  overflow:hidden; min-height:calc(1.3em * 2)}

.vago{border:1px dashed var(--line-forte); border-radius:8px; padding:13px 10px;
  text-align:center; color:var(--ink-3); font-size:11.5px; background:none}
.vago.passou{border-style:solid; border-color:var(--line); opacity:.55}
.vago .h{font-family:"IBM Plex Mono",monospace; font-weight:600;
  color:var(--ink-3); font-size:12px; display:block; margin-bottom:2px}
.folga{border-radius:8px; padding:13px 10px; text-align:center;
  background:var(--sunk); color:var(--ink-3); font-size:11.5px}

/* --------------------------------------------------------- etiquetas */
.tag{display:inline-flex; align-items:center; gap:4px; font-size:10px;
  font-weight:600; text-transform:uppercase; letter-spacing:.07em;
  padding:2.5px 7px; border-radius:5px; white-space:nowrap}
.f-carrossel{background:var(--roxo-lavado); color:var(--roxo-tinta)}
.f-reels{background:var(--teal-lavado); color:var(--teal)}
.f-epico{background:var(--ambar-lavado); color:var(--ambar)}
.f-story{background:var(--sunk); color:var(--ink-2)}
.ponto{width:7px; height:7px; border-radius:50%; flex:0 0 auto}
.s-ideia{background:var(--ink-3)} .s-roteiro{background:var(--teal)}
.s-pronto{background:var(--roxo)} .s-publicado{background:var(--verde)}
.selo-parceria{display:inline-block; font-size:10px; font-weight:600;
  color:var(--ambar); background:var(--ambar-lavado); padding:2px 6px;
  border-radius:4px}

/* ----------------------------------------------------------- backlog */
.pautas{display:grid; grid-template-columns:repeat(auto-fill,minmax(280px,1fr));
  gap:10px}
.pauta{background:var(--surface); border:1px solid var(--line);
  border-left:3px solid var(--roxo); border-radius:9px; padding:13px 15px;
  display:flex; gap:13px; align-items:flex-start; width:100%; text-align:left;
  font:inherit; color:inherit}
button.pauta{cursor:pointer}
button.pauta:hover{border-color:var(--roxo)}
.pauta img{width:58px; flex:0 0 auto; border-radius:5px; border:1px solid var(--line)}
.pauta .corpo{min-width:0}
.pauta .pronto{color:var(--roxo); font-weight:600}
.pauta .t{font-weight:600; font-size:14.5px; margin:7px 0 4px; line-height:1.3}
.pauta .n{font-size:13px; color:var(--ink-2); line-height:1.45}

/* --------------------------------------------------------------- mix */
.mix{background:var(--surface); border:1px solid var(--line);
  border-radius:11px; padding:18px 20px}
.barra-linha{display:grid; grid-template-columns:88px 1fr 42px;
  align-items:center; gap:12px; padding:7px 0}
.barra-linha + .barra-linha{border-top:1px solid var(--line)}
.barra-nome{font-size:13px; color:var(--ink-2)}
.barra-trilho{height:9px; background:var(--sunk); border-radius:99px; overflow:hidden}
.barra-preenche{height:100%; border-radius:99px}
.barra-num{font-family:"IBM Plex Mono",monospace; font-size:13.5px;
  font-weight:600; text-align:right}

/* ------------------------------------------------------------- dobras */
.dobra > summary{cursor:pointer; list-style:none; margin-bottom:0;
  padding:11px 14px; border:1px solid var(--line); border-radius:10px;
  background:var(--surface)}
.dobra > summary::-webkit-details-marker{display:none}
.dobra > summary:hover{border-color:var(--line-forte)}
.dobra[open] > summary{border-bottom-left-radius:0; border-bottom-right-radius:0}
.seta{width:0; height:0; flex:0 0 auto;
  border-left:6px solid var(--roxo); border-top:5px solid transparent;
  border-bottom:5px solid transparent; transition:transform .18s ease}
.dobra[open] > summary .seta{transform:rotate(90deg)}
.dobra-corpo{border:1px solid var(--line); border-top:0;
  border-radius:0 0 10px 10px; padding:18px 16px 6px}

.mes-dobra{margin-bottom:10px}
.mes-dobra > summary{cursor:pointer; list-style:none; display:flex;
  align-items:baseline; gap:11px; padding:7px 2px;
  border-bottom:1px solid var(--line); margin-bottom:11px}
.mes-dobra > summary::-webkit-details-marker{display:none}
.mes-dobra > summary:hover h3{color:var(--roxo)}
.mes-dobra > summary h3{font-size:15.5px; font-weight:700}
.mes-dobra > summary .conta-mes{font-size:12px; color:var(--ink-3);
  font-family:"IBM Plex Mono",monospace}

/* --------------------------------------------------------- histórico */
.grade{display:grid; grid-template-columns:repeat(auto-fill,minmax(112px,1fr));
  gap:10px}
.grade .slot .nome{font-size:11.5px; font-weight:400; color:var(--ink-2)}

/* ------------------------------------------------------------ painel */
dialog{border:0; padding:0; background:var(--surface); color:var(--ink);
  border-radius:14px; max-width:820px; width:calc(100% - 32px);
  box-shadow:0 24px 70px -18px rgba(15,20,25,.5)}
dialog::backdrop{background:rgba(15,20,25,.55); backdrop-filter:blur(2px)}
.painel{display:grid; grid-template-columns:270px 1fr; gap:26px; padding:26px}
dialog{max-height:88vh; overflow:auto}
.painel img{width:100%; border-radius:9px; border:1px solid var(--line);
  display:block}
.painel h3{font-size:21px; font-weight:700; line-height:1.25; margin-bottom:8px}
.painel .gancho{margin:0 0 16px; color:var(--ink-2); font-size:15px;
  line-height:1.45}
.ver-slides{width:100%; margin-top:11px}
.galeria{grid-column:1/-1; display:flex; flex-direction:column; gap:16px}
.galeria figure{margin:0; position:relative}
.galeria img{width:100%; border-radius:9px; border:1px solid var(--line);
  display:block}
.galeria figcaption{position:absolute; top:9px; left:9px; background:var(--ink);
  color:var(--ground); font-size:11px; padding:2px 7px; border-radius:5px;
  opacity:.75}
.btn.voltar{align-self:flex-start; position:sticky; top:0; z-index:2}
.painel-meta{display:flex; flex-wrap:wrap; gap:7px; align-items:center;
  margin-bottom:16px}
.legenda-cx{background:var(--sunk); border:1px solid var(--line);
  border-radius:9px; padding:15px; max-height:340px; overflow:auto;
  white-space:pre-wrap; font-size:13.5px; line-height:1.55; color:var(--ink-2)}
.legenda-cab{display:flex; align-items:baseline; justify-content:space-between;
  margin-bottom:7px; font-size:11px; text-transform:uppercase;
  letter-spacing:.09em; color:var(--ink-3); font-weight:600}
.fechar{position:absolute; top:14px; right:16px; background:var(--surface);
  border:1px solid var(--line-forte); border-radius:7px; width:30px; height:30px;
  cursor:pointer; color:var(--ink-2); font-size:17px; line-height:1}
.rodape{border-top:1px solid var(--line); padding-top:18px; color:var(--ink-3);
  font-size:12.5px; line-height:1.6}

/* ------------------------------------------------------------ tranca */
.tranca{min-height:78vh; display:flex; align-items:center; justify-content:center;
  padding:24px}
.cofre{background:var(--surface); border:1px solid var(--line); border-radius:14px;
  padding:30px 28px; width:100%; max-width:340px; display:flex;
  flex-direction:column; gap:13px}
.cadeado{width:30px; height:30px; align-self:center; color:var(--ink-3);
  margin-bottom:3px}
.cofre input{font:400 16px/1 "Public Sans",sans-serif; padding:12px 13px;
  border:1px solid var(--line-forte); border-radius:8px; background:var(--ground);
  color:var(--ink); width:100%}
.cofre input:focus{border-color:var(--roxo); outline:none;
  box-shadow:0 0 0 3px var(--roxo-lavado)}
.btn.primario{background:var(--roxo); border-color:var(--roxo); color:#fff;
  padding:12px; font-size:14.5px; font-weight:600}
.btn.primario:hover{opacity:.9; color:#fff}
.btn.primario[disabled]{opacity:.55}
.erro{color:var(--vermelho); font-size:13.5px}

@media (max-width:900px){
  .semana{grid-template-columns:1fr; gap:8px}
  .dia{flex-direction:row; align-items:stretch}
  .dia-cab{flex-direction:column; align-items:center; justify-content:center;
    border-bottom:0; border-right:1px solid var(--line); min-width:74px;
    padding:11px 8px; gap:2px}
  .dia-corpo{flex-direction:row; overflow-x:auto}
  .dia-corpo > *{min-width:148px; flex:1}
  .painel{grid-template-columns:1fr; padding:20px}
  .painel img{max-width:200px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important; transition:none!important}}
</style>

<div class="tranca" id="tranca" hidden>
  <form class="cofre" id="cofre">
    <svg class="cadeado" viewBox="0 0 24 24" fill="none" aria-hidden="true">
      <rect x="4.5" y="10.5" width="15" height="10" rx="2.2"
            stroke="currentColor" stroke-width="1.7"></rect>
      <path d="M8 10.5V7.6a4 4 0 0 1 8 0v2.9" stroke="currentColor"
            stroke-width="1.7" stroke-linecap="round"></path>
    </svg>
    <input type="password" id="senha" placeholder="senha" autocomplete="current-password"
           aria-label="Senha" required autofocus>
    <button class="btn primario" type="submit" id="abrir">Abrir</button>
    <div class="erro" id="erro" role="alert" hidden></div>
  </form>
</div>

<div class="env" id="env" hidden>
  <header class="topo">
    <div class="marca">
      <h1>Agenda editorial</h1>
      <div class="arroba">@opapoeconomico</div>
    </div>
    <div class="ritmo">
      <div class="ritmo-item">Carrossel <b>12h</b></div>
      <div class="ritmo-item">Reels <b>18h</b></div>
      <div class="ritmo-item" id="hoje-e">—</div>
      <div class="ritmo-item atualizada" id="atualizada"></div>
    </div>
  </header>

  <div class="resumo" id="resumo"></div>

  <section>
    <div class="cab">
      <h2>Semana</h2>
      <span class="conta" id="conta-semana"></span>
      <div class="nav">
        <button class="btn" id="ant" aria-label="Semana anterior">‹</button>
        <span class="periodo mono" id="periodo"></span>
        <button class="btn" id="prox" aria-label="Próxima semana">›</button>
        <button class="btn" id="hoje-btn">Hoje</button>
      </div>
    </div>
    <div class="semana" id="semana"></div>
  </section>

  <section>
    <div class="cab">
      <h2>Backlog de pautas</h2>
      <span class="conta" id="conta-backlog"></span>
    </div>
    <div class="pautas" id="backlog"></div>
  </section>

  <section>
    <div class="cab"><h2>O mês em números</h2><span class="conta" id="conta-mes"></span></div>
    <div class="mix" id="mix"></div>
  </section>

  <section>
    <details class="dobra" id="dobra-hist">
      <summary class="cab">
        <span class="seta" aria-hidden="true"></span>
        <h2>Já publicado</h2>
        <span class="conta" id="conta-hist"></span>
      </summary>
      <div id="historico" class="dobra-corpo"></div>
    </details>
  </section>

  <div class="rodape" id="rodape"></div>
</div>

<dialog id="painel">
  <button class="fechar" id="fechar" aria-label="Fechar">×</button>
  <div class="painel" id="painel-corpo"></div>
</dialog>

<script>
let D = null;
const EMBUTIDO = /*DADOS*/null;   /* a versão local traz os dados aqui */
const CIFRA = {"arquivo": "7ef83k2zt7/a-80054c66038d091b.bin", "voltas": 600000, "sal": "k5Tu6ZgU9Oc63mA3W6h74A=="};      /* a publicada traz o arquivo cifrado */

const DIAS = ["Dom","Seg","Ter","Qua","Qui","Sex","Sáb"];
const MESES = ["janeiro","fevereiro","março","abril","maio","junho","julho",
               "agosto","setembro","outubro","novembro","dezembro"];
const FORMATOS = {carrossel:"Carrossel", reels:"Reels", epico:"Épico", story:"Story"};

const maiuscula = s => s.charAt(0).toUpperCase() + s.slice(1);
const esc = s => String(s == null ? "" : s).replace(/[&<>"]/g,
  c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const iso = d => d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0")
                 + "-" + String(d.getDate()).padStart(2,"0");
const deIso = s => { const [a,m,d] = s.split("-").map(Number);
                     return new Date(a, m-1, d); };

const HOJE = new Date(); HOJE.setHours(0,0,0,0);
const HOJE_ISO = iso(HOJE);
let deslocamento = 0;

/* a segunda-feira da semana de uma data */
function segunda(d){
  const x = new Date(d);
  x.setDate(x.getDate() - ((x.getDay() + 6) % 7));
  x.setHours(0,0,0,0);
  return x;
}

const porDia = {}, folgaDe = {}, porSlug = {};

function iniciar(dados){
  D = dados;
  D.posts.forEach(p => (porDia[p.data] = porDia[p.data] || []).push(p));
  Object.values(porDia).forEach(l => l.sort((a,b) => a.hora.localeCompare(b.hora)));
  D.folgas.forEach(f => folgaDe[f.data] = f.motivo);
  D.posts.forEach(p => porSlug[p.slug] = p);
  D.historico.forEach(m => m.posts.forEach(p => porSlug[p.slug] = p));
  D.backlog.forEach(b => { if (b.slug) porSlug[b.slug] = b; });
  montarResumo(); montarSemana(); montarBacklog(); montarMix(); montarHistorico();
  document.getElementById("tranca").hidden = true;
  document.getElementById("env").hidden = false;
  document.title = "Agenda @opapoeconomico";   /* só depois de abrir */
}

/* conta os horários-padrão livres na semana — um dia pode ter 3 posts, então
   "14 menos o que saiu" mentiria */
function vagosDe(inicio){
  let vagos = 0;
  for (let i = 0; i < 7; i++){
    const d = new Date(inicio); d.setDate(d.getDate()+i);
    const chave = iso(d);
    if (folgaDe[chave]) continue;
    const ocupadas = new Set((porDia[chave] || []).map(p => p.hora.slice(0,5)));
    ["12:00","18:00"].forEach(hora => { if (!ocupadas.has(hora)) vagos++; });
  }
  return vagos;
}

/* ------------------------------------------------------------ resumo */
function montarResumo(){
  const hoje = porDia[HOJE_ISO] || [];
  const ini = segunda(HOJE), fim = new Date(ini); fim.setDate(fim.getDate()+7);
  const naSemana = D.posts.filter(p => {
    const d = deIso(p.data); return d >= ini && d < fim; });
  const prontos = D.posts.filter(p => p.status === "pronto").length
                + D.backlog.filter(b => b.slug).length;
  const vagos = vagosDe(ini);
  const cx = [
    ["Hoje", hoje.length || "—", hoje.length
      ? "<small>post" + (hoje.length > 1 ? "s" : "") + " · "
        + [...new Set(hoje.map(p => p.hora.slice(0,5)))].join(" e ") + "</small>"
      : "<small>nada programado</small>"],
    ["Nesta semana", naSemana.length, "<small>posts</small>"],
    ["Prontos, sem data", prontos, "<small>na fila</small>"],
    ["Slots vagos na semana", vagos, "<small>sem pauta</small>"],
    ["Backlog", D.backlog.length, "<small>ideias guardadas</small>"]
  ];
  document.getElementById("resumo").innerHTML = cx.map(([k,v,s]) =>
    `<div><div class="k">${k}</div><div class="v">${v} ${s||""}</div></div>`).join("");
  document.getElementById("atualizada").textContent =
    D.atualizadoEm ? "atualizada " + D.atualizadoEm : "";
  document.getElementById("hoje-e").innerHTML =
    "Hoje <b>" + HOJE.getDate() + "/" + String(HOJE.getMonth()+1).padStart(2,"0") + "</b>";
}

/* ------------------------------------------------------------- slots */
function cartao(p){
  /* no calendário só a foto e o nome curto; o gancho e a legenda ficam
     guardados pro painel, que abre no clique */
  const capa = p.capa
    ? `<img class="capa" src="${p.capa}" alt="Capa: ${esc(p.nome || p.titulo)}" loading="lazy">`
    : `<div class="semcapa">ainda<br>sem arte</div>`;
  const hora = (p.hora || "").slice(0,5);
  return `<button class="slot" data-slug="${esc(p.slug)}">
    ${capa}
    <div class="meta">
      <span class="ponto s-${esc(p.status)}" title="${esc(p.status)}"></span>
      ${hora ? `<span class="hora">${hora}</span>` : ""}
      <span class="tag f-${esc(p.formato)}">${FORMATOS[p.formato]||p.formato}</span>
    </div>
    <div class="nome">${esc(p.nome || p.titulo)}</div>
  </button>`;
}

function vago(hora, formato, passou){
  /* no passado um slot vazio quer dizer "não saiu nada"; no futuro, "falta pauta" */
  return `<div class="vago${passou ? " passou" : ""}"><span class="h">${hora}</span>${
    passou ? "não saiu" : FORMATOS[formato] + " · sem pauta"}</div>`;
}

function montarSemana(){
  const ini = segunda(HOJE); ini.setDate(ini.getDate() + deslocamento*7);
  const alvo = document.getElementById("semana");
  let html = "", total = 0;

  for (let i = 0; i < 7; i++){
    const d = new Date(ini); d.setDate(d.getDate()+i);
    const chave = iso(d), lista = porDia[chave] || [];
    total += lista.length;
    let corpo;
    if (folgaDe[chave]){
      corpo = `<div class="folga">${esc(folgaDe[chave])}</div>`;
    } else {
      const ocupadas = new Set(lista.map(p => p.hora.slice(0,5)));
      const faltando = [["12:00","carrossel"],["18:00","reels"]]
        .filter(([h]) => !ocupadas.has(h));
      const passou = chave < HOJE_ISO;
      corpo = lista.map(cartao).join("")
            + faltando.map(([h,f]) => vago(h, f, passou)).join("");
    }
    html += `<div class="dia${chave === HOJE_ISO ? " hoje" : ""}">
      <div class="dia-cab">
        <span class="semana-nome">${DIAS[d.getDay()]}</span>
        <span class="num">${d.getDate()}</span>
      </div>
      <div class="dia-corpo">${corpo}</div>
    </div>`;
  }
  alvo.innerHTML = html;

  const fim = new Date(ini); fim.setDate(fim.getDate()+6);
  document.getElementById("periodo").textContent =
    ini.getDate() + " " + MESES[ini.getMonth()].slice(0,3) + " – " +
    fim.getDate() + " " + MESES[fim.getMonth()].slice(0,3);
  document.getElementById("conta-semana").textContent =
    total + (total === 1 ? " post" : " posts") + " · " + vagosDe(ini) +
    " horários livres";
  document.getElementById("hoje-btn").disabled = deslocamento === 0;
}

/* ----------------------------------------------------------- backlog */
function montarBacklog(){
  document.getElementById("conta-backlog").textContent =
    D.backlog.length + " ideia" + (D.backlog.length === 1 ? "" : "s") + " sem data";
  document.getElementById("backlog").innerHTML = D.backlog.length
    ? D.backlog.map(b => {
        /* pauta que já virou post abre o painel, como qualquer capa da grade */
        const tag = `<span class="tag f-${esc(b.formato)}">${
          FORMATOS[b.formato] || esc(b.formato)}</span>`;
        const nota = b.nota.startsWith("PRONTO")
          ? `<div class="n"><span class="pronto">${esc(b.nota)}</span></div>`
          : `<div class="n">${esc(b.nota)}</div>`;
        const dentro = `${b.capa ? `<img src="${b.capa}" alt="">` : ""}
          <div class="corpo">${tag}
            <div class="t">${esc(b.titulo)}</div>${nota}</div>`;
        return b.slug
          ? `<button class="pauta slot" data-slug="${esc(b.slug)}">${dentro}</button>`
          : `<div class="pauta">${dentro}</div>`;
      }).join("")
    : `<div class="pauta"><div class="corpo"><div class="n">Nenhuma pauta guardada.</div></div></div>`;
}

/* --------------------------------------------------------------- mix */
function montarMix(){
  const mes = HOJE_ISO.slice(0,7);
  const doMes = D.posts.filter(p => p.data.slice(0,7) === mes);
  const bloco = D.historico.find(h => h.mes === mes);
  const todos = doMes.concat(bloco ? bloco.posts : []);
  const conta = {};
  todos.forEach(p => conta[p.formato] = (conta[p.formato]||0) + 1);
  const parcerias = todos.filter(p => p.parceria).length;
  const maior = Math.max(1, ...Object.values(conta));
  const cores = {carrossel:"var(--roxo)", reels:"var(--teal)",
                 epico:"var(--ambar)", story:"var(--ink-3)"};

  document.getElementById("conta-mes").textContent =
    MESES[Number(mes.slice(5))-1] + " · " + todos.length + " peças";
  const linhas = Object.keys(FORMATOS).filter(f => conta[f]).map(f =>
    `<div class="barra-linha">
      <span class="barra-nome">${FORMATOS[f]}</span>
      <div class="barra-trilho"><div class="barra-preenche"
        style="width:${(conta[f]/maior*100).toFixed(1)}%;background:${cores[f]}"></div></div>
      <span class="barra-num">${conta[f]}</span>
    </div>`).join("");
  document.getElementById("mix").innerHTML = linhas +
    `<div class="barra-linha">
      <span class="barra-nome">Parceria / publi</span>
      <div class="barra-trilho"><div class="barra-preenche"
        style="width:${todos.length ? (parcerias/todos.length*100).toFixed(1) : 0}%;
        background:var(--verde)"></div></div>
      <span class="barra-num">${parcerias}</span>
    </div>`;
}

/* --------------------------------------------------------- histórico */
function montarHistorico(){
  /* a conta aparece no fecho; as 50+ capas só são desenhadas ao abrir */
  const total = D.historico.reduce((s,m) => s + m.posts.length, 0);
  document.getElementById("conta-hist").textContent = total + " posts no registro";
}

let historicoDesenhado = false;
function desenharHistorico(){
  if (historicoDesenhado) return;
  historicoDesenhado = true;
  document.getElementById("historico").innerHTML = D.historico.map((m, i) => {
    const [ano, mm] = m.mes.split("-");
    return `<details class="mes-dobra"${i === 0 ? " open" : ""}>
      <summary>
        <span class="seta" aria-hidden="true"></span>
        <h3>${maiuscula(MESES[Number(mm)-1])} de ${ano}</h3>
        <span class="conta-mes">${m.posts.length} posts</span>
      </summary>
      <div class="grade">${m.posts.map(p => cartao(
        Object.assign({}, p, {status:"publicado", hora:""}))).join("")}</div>
    </details>`;
  }).join("");
}

document.getElementById("dobra-hist").addEventListener("toggle", function(){
  if (this.open) desenharHistorico();
});

/* ------------------------------------------------------------ painel */
const painel = document.getElementById("painel");
document.getElementById("fechar").onclick = () => painel.close();
painel.addEventListener("click", e => { if (e.target === painel) painel.close(); });

document.addEventListener("click", e => {
  const b = e.target.closest(".slot");
  if (!b) return;
  const p = porSlug[b.dataset.slug];
  if (p) abrirPainel(p);
});

function abrirPainel(p){
  const chars = p.legendaChars || (p.legenda
    ? [...p.legenda].reduce((n,c) => n + (c.codePointAt(0) > 0xFFFF ? 2 : 1), 0)
    : null);
  const temSlides = p.arquivoSlides;   /* vem cifrado, junto do post */
  document.getElementById("painel-corpo").innerHTML = `
    <div>${p.capa
      ? `<img src="${p.capa}" alt="Capa de ${esc(p.nome || p.titulo)}">`
      : `<div class="semcapa" style="aspect-ratio:4/5">ainda sem arte</div>`}
      ${temSlides ? `<button class="btn primario ver-slides" data-slug="${esc(p.slug)}"
        >Ver o post inteiro (${p.temSlides} slides)</button>` : ""}
    </div>
    <div>
      <div class="painel-meta">
        <span class="tag f-${esc(p.formato)}">${FORMATOS[p.formato]||p.formato}</span>
        ${p.status ? `<span class="tag" style="background:var(--sunk);color:var(--ink-2)">
          <span class="ponto s-${esc(p.status)}"></span>${esc(p.status)}</span>` : ""}
        ${p.data ? `<span class="mono" style="font-size:12.5px;color:var(--ink-2)">
          ${esc(p.data.split("-").reverse().join("/"))}${
            p.hora ? " · " + esc(p.hora.slice(0,5)) : ""}</span>` : ""}
        ${p.slides ? `<span class="mono" style="font-size:12.5px;color:var(--ink-3)">${p.slides} slides</span>` : ""}
        ${p.parceria ? `<span class="selo-parceria">${esc(p.parceria[0])}${
          p.parceria[1] ? " · " + esc(p.parceria[1]) : ""}</span>` : ""}
      </div>
      <h3>${esc(p.nome || p.titulo)}</h3>
      ${p.titulo && p.titulo !== p.nome
        ? `<p class="gancho">${esc(p.titulo)}</p>` : ""}
      ${p.legenda ? `
        <div class="legenda-cab"><span>Legenda</span>
          <span class="mono">${chars} / 2.200</span></div>
        <div class="legenda-cx">${esc(p.legenda)}</div>`
      : `<div class="legenda-cx">Legenda ainda não escrita.</div>`}
    </div>`;
  painel.showModal();
}

/* os slides não vêm na página: são um arquivo cifrado por post, baixado aqui */
document.addEventListener("click", async e => {
  const b = e.target.closest(".ver-slides");
  if (!b) return;
  const post = porSlug[b.dataset.slug];
  const arquivo = post && post.arquivoSlides;
  if (!arquivo) return;
  b.disabled = true; b.textContent = "Carregando…";
  try {
    const { slides } = await abrirCofre(arquivo);
    document.getElementById("painel-corpo").innerHTML =
      `<div class="galeria">
         <button class="btn voltar" id="voltar">‹ voltar</button>
         ${slides.map((s,i) => `<figure><img src="${s}" alt="Slide ${i+1}" loading="lazy">
            <figcaption class="mono">${i+1}</figcaption></figure>`).join("")}
       </div>`;
    document.getElementById("voltar").onclick = () => abrirPainel(post);
    painel.scrollTop = 0;
  } catch (_) {
    b.disabled = false; b.textContent = "Não consegui carregar — tente de novo";
  }
});

/* -------------------------------------------------------------- start */
document.getElementById("ant").onclick  = () => { deslocamento--; montarSemana(); };
document.getElementById("prox").onclick = () => { deslocamento++; montarSemana(); };
document.getElementById("hoje-btn").onclick = () => { deslocamento = 0; montarSemana(); };

document.getElementById("rodape").innerHTML =
  "Esta página é gerada a partir do projeto — <code>docs/AGENDA.md</code> é a fonte de verdade da programação e "
  + "<code>docs/REGISTRO.md</code> guarda o que já foi publicado. Clique em qualquer capa para ver a legenda inteira. "
  + "As capas dos reels são um quadro do vídeo aos 2 segundos.";

/* ---------------------------------------------------- abrir a agenda */
let CHAVE = null;

async function abrirCofre(arquivo){
  const r = await fetch(arquivo, {cache:"no-store"});
  if (!r.ok) throw new Error("sem-arquivo");   /* versão velha no cache */
  const b = new Uint8Array(await r.arrayBuffer());
  const claro = await crypto.subtle.decrypt(
    {name:"AES-GCM", iv: b.slice(0,12)}, CHAVE, b.slice(12));
  return JSON.parse(new TextDecoder().decode(claro));
}

async function destrancar(senha){
  /* o sal é um só por publicação e vem no manifesto: a chave é derivada uma
     vez (PBKDF2 custa ~0,4s) e depois abre a agenda e cada post na hora */
  const sal = Uint8Array.from(atob(CIFRA.sal), c => c.charCodeAt(0));
  const base = await crypto.subtle.importKey(
    "raw", new TextEncoder().encode(senha), "PBKDF2", false, ["deriveKey"]);
  CHAVE = await crypto.subtle.deriveKey(
    {name:"PBKDF2", salt:sal, iterations:CIFRA.voltas, hash:"SHA-256"},
    base, {name:"AES-GCM", length:256}, false, ["decrypt"]);
  return abrirCofre(CIFRA.arquivo);
}

if (EMBUTIDO){
  iniciar(EMBUTIDO);
} else if (CIFRA){
  const tranca = document.getElementById("tranca");
  const campo = document.getElementById("senha");
  const botao = document.getElementById("abrir");
  const erro = document.getElementById("erro");
  tranca.hidden = false;
  campo.focus();
  document.getElementById("cofre").addEventListener("submit", async e => {
    e.preventDefault();
    erro.hidden = true; botao.disabled = true; botao.textContent = "Abrindo…";
    try {
      iniciar(await destrancar(campo.value));
      try { localStorage.setItem("agenda-senha", campo.value); } catch (_) {}
    } catch (e) {
      erro.textContent = (e && e.message === "sem-arquivo")
        ? "Esta página está desatualizada no seu navegador. Recarregue segurando "
          + "Shift (no celular, feche a aba e abra o link de novo)."
        : "Senha incorreta.";
      erro.hidden = false; campo.select();
    } finally {
      botao.disabled = false; botao.textContent = "Abrir";
    }
  });
  /* quem já entrou uma vez neste aparelho não digita de novo */
  let guardada = null;
  try { guardada = localStorage.getItem("agenda-senha"); } catch (_) {}
  if (guardada) destrancar(guardada).then(iniciar).catch(() => {
    try { localStorage.removeItem("agenda-senha"); } catch (_) {}
  });
} else {
  document.getElementById("env").hidden = false;
}
</script>
